steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/beast3-mesh-orchestrator:$SHORT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/beast3-mesh-orchestrator:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'beast3-mesh-orchestrator'
      - '--image=gcr.io/$PROJECT_ID/beast3-mesh-orchestrator:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-secrets=BEAST_SYNC_PAT=BEAST_SYNC_PAT:latest,BEAST_WEBHOOK_SECRET=BEAST_WEBHOOK_SECRET:latest'

images:
  - 'gcr.io/$PROJECT_ID/beast3-mesh-orchestrator:$SHORT_SHA'
